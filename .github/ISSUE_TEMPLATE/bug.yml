name: Bug
description: Something in the app doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What to do to see it, from a fresh start where that matters.
      placeholder: |
        1. Open Cut on a photo.
        2. Tap an object.
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: Seen
      description: What happens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Platform, device or window size, and the build or commit.
      placeholder: Web at 375 points, feat/cut-tool at 1191c24
  - type: textarea
    id: unknown
    attributes:
      label: Unknown
      description: What isn't known yet, and where to look first.
