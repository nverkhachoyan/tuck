name: Check & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".zed/**"
      - "docs/store-listing/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".zed/**"
      - "docs/store-listing/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Takes pnpm's version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      # The interactive docs import the app's model, so a change there that a
      # lesson depends on fails here.
      - run: pnpm --dir docs/interactive build
      - run: pnpm test
      # Bundles the web app with Metro, which the checks above never run, so an
      # import only Metro resolves (a `.web.ts` file's, an asset, the entry's
      # untyped `import()`) fails here instead of at deploy.
      - run: pnpm build:web

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
