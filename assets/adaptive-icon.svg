			<circle cx="63" cy="35" r="5.8" fill="#1A0D08" fill-opacity=".25"/>
			<path d="M21.8 82 L41 60.2 L60.2 82 Z" fill="#1A0D08" fill-opacity=".25"/>
		</g>
		<path d="M24 74 C 29 64, 33 82, 38 72 S 44 69, 47 70" fill="none" stroke="#F5F5F7" stroke-width="4" stroke-linecap="round"/>
		<g transform="translate(47 70) rotate(-45)" filter="url(#lift)">
			<path d="M0 0 L13 -6 L13 6 Z" fill="#C9C9CE"/>
			<path d="M0 0 L5 -2.3 L5 2.3 Z" fill="#1A0D08"/>
			<rect x="13" y="-7" width="46" height="14" rx="3" fill="#F5F5F7"/>
			<rect x="44" y="-7" width="4" height="14" fill="#C9C9CE"/>
		</g>
	</g>
</svg>
