<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
	<title>Tuck</title>
	<!-- Source for adaptive-icon.png, the Android adaptive icon's foreground, over app.json's background color. The mark stays inside the launcher mask's safe zone. The mark matches src/ui/LogoMark.tsx. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#1E1E22"/>
			<stop offset="1" stop-color="#0A0A0B"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.464" cy="0.5" r="0.34">
			<stop offset="0" stop-color="#FF6B4A" stop-opacity="0.3"/>
			<stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
		</radialGradient>
		<filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
			<feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
		</filter>
	</defs>
	
	<rect width="1024" height="1024" fill="url(#glow)"/>
	<g transform="translate(512 512) scale(6.2) translate(-54 -50)">
