<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:393px;height:852px;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;background:#f2f2f6;color:#111;overflow:hidden}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 36px;font-weight:600;font-size:16px}
.status .r{display:flex;gap:6px;align-items:center}
.bar{width:25px;height:12px;border:1.5px solid #111;border-radius:4px;position:relative}.bar:after{content:"";position:absolute;inset:1.5px;right:5px;background:#111;border-radius:1.5px}
h1{font-size:32px;font-weight:700;padding:14px 18px 6px}
.sub{font-size:14px;color:#6c6c70;padding:0 18px 16px}
.group{margin:0 16px 22px;background:#fff;border-radius:14px;overflow:hidden}
.label{font-size:13px;color:#6c6c70;text-transform:uppercase;letter-spacing:.3px;padding:0 32px 7px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:16.5px;border-bottom:1px solid #ececf0}
.row:last-child{border-bottom:0}
.ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.grow{flex:1}.grow small{display:block;font-size:13px;color:#8a8a8e;margin-top:2px}
.sw{width:51px;height:31px;border-radius:16px;background:#e3e3e8;position:relative}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on{background:#34a853}.sw.on:after{left:22px}
.chev{color:#c4c4c8;font-size:20px}
</style></head><body>
<div class="status"><span>9:41</span><span class="r"><span class="bar"></span></span></div>
<h1>Notifications</h1>
<div class="sub">Choose what you hear about, and when.</div>
<div class="label">Alerts</div>
<div class="group">
<div class="row"><div class="ic" style="background:#f4a536">!</div><div class="grow">Bills due<small>Two days before</small></div><div class="sw on"></div></div>
<div class="row"><div class="ic" style="background:#5b8def">$</div><div class="grow">Large purchases<small>Over $200</small></div><div class="sw on"></div></div>
<div class="row" id="subs"><div class="ic" style="background:#9b6bdf">↻</div><div class="grow">Subscriptions renewing<small>A week before</small></div><div class="sw" id="subsw"></div></div>
</div>
<div class="label">Summaries</div>
<div class="group">
<div class="row"><div class="ic" style="background:#34a853">W</div><div class="grow">Weekly spending</div><div class="sw"></div></div>
<div class="row"><div class="ic" style="background:#e0463d">M</div><div class="grow">Monthly report</div><div class="sw on"></div></div>
</div>
<div class="label">Delivery</div>
<div class="group">
<div class="row"><div class="grow">Sounds</div><span class="chev">›</span></div>
<div class="row"><div class="grow">Quiet hours<small>10 PM – 7 AM</small></div><span class="chev">›</span></div>
</div>
</body></html>
